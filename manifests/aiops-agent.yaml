# Agent IA — ServiceAccount, RBAC, Deployment et Service.
#
# L'agent a besoin de trois choses :
#   1. une identité (ServiceAccount) pour parler à l'API Kubernetes ;
#   2. des droits (Role + RoleBinding) limités au namespace « aiops » ;
#   3. une image à exécuter (Deployment) et une adresse stable (Service).
#
# Le Service est indispensable : c'est par son nom DNS interne
# (aiops-agent.aiops.svc.cluster.local) qu'Alertmanager livrera le webhook.

# ---------------------------------------------------------------------------
# 1. ServiceAccount — l'identité de l'agent
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-agent
  namespace: aiops
  labels:
    app: aiops-agent
    app.kubernetes.io/part-of: k8s-aiops-agent
---
# ---------------------------------------------------------------------------
# 2. Role — les droits, limités au namespace « aiops »
# ---------------------------------------------------------------------------
# Un Role (et non un ClusterRole) : les droits s'arrêtent au boundary du
# namespace. Un agent de diagnostic n'a aucune raison de lire ce qui se
# passe dans le reste du cluster — et encore moins les Secrets.
#
# Les trois ressources nécessaires :
#   - pods          : lire l'état du pod (dernier arrêt, redémarrages)
#   - events        : lire l'historique narratif du namespace
#   - pods/log      : lire les logs (logs du conteneur ET du conteneur
#                     précédent, via le paramètre previous=true)
#
# ATTENTION sur pods/log : c'est une SOUS-RESSOURCE. Elle ne fait pas
# partie de l'objet Pod et doit être demandée explicitement. Un RBAC qui
# l'oublie donne une application qui démarre sans erreur et qui n'arrive
# pas à lire un seul log : le diagnostic devient aveugle sans le moindre
# message d'erreur. C'est le piège classique du RBAC Kubernetes.
#
# Le seul droit d'ÉCRITURE sert à l'auto-guérison (étape 4) : relever la
# limite de mémoire d'un Deployment après un OOMKill.
#   - get   : lire la limite actuelle et l'annotation de la dernière action ;
#   - patch : modifier la limite. Pas de update (qui réécrit l'objet
#             entier), pas de create ni de delete.
#   - resourceNames : seul le Deployment demo-app est modifiable. L'agent ne
#             peut ni toucher à Ollama ou Prometheus, ni à son propre
#             Deployment. Pour soigner une autre application, ajouter son
#             nom ici : sans cela, l'action échoue en 403, visible dans les
#             logs (status « failed »).
#
# Le pod n'est pas lu via son ReplicaSet : le nom du Deployment est déduit
# du nom du ReplicaSet, ce qui évite d'ajouter un droit sur les replicasets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-agent
  namespace: aiops
  labels:
    app: aiops-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["demo-app"]
    verbs: ["get", "patch"]
---
# ---------------------------------------------------------------------------
# 3. RoleBinding — le lien entre l'identité et les droits
# ---------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-agent
  namespace: aiops
  labels:
    app: aiops-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-agent
subjects:
  - kind: ServiceAccount
    name: aiops-agent
    namespace: aiops
---
# ---------------------------------------------------------------------------
# 4. Deployment — l'agent lui-même
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-agent
  namespace: aiops
  labels:
    app: aiops-agent
    app.kubernetes.io/part-of: k8s-aiops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-agent
  template:
    metadata:
      labels:
        app: aiops-agent
    spec:
      serviceAccountName: aiops-agent
      # automountServiceAccountToken: true est le comportement par
      # défaut depuis Kubernetes 1.24 — le token est monté dans le pod.
      # On le déclare explicitement pour que le lien soit visible.
      automountServiceAccountToken: true
      # Même durcissement que demo-app : UID 1000 imposé (USER du
      # Dockerfile), aucune capacité, système de fichiers en lecture seule.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aiops-agent
          image: ghcr.io/abi0066/k8s-aiops-agent:sha-642e773
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            # Adresse d'Ollama : nom DNS interne du Service Kubernetes.
            # Jamais une IP en dur : le Service assure le load-balancing
            # et l'adresse peut changer si le Service est recréé.
            - name: OLLAMA_URL
              value: "http://ollama.aiops.svc.cluster.local:11434"
            - name: PROMETHEUS_URL
              value: "http://prometheus.aiops.svc.cluster.local:9090"
            # Le modèle est déclaré une seule fois, dans la ConfigMap
            # d'Ollama (manifests/ollama.yaml) : l'initContainer d'Ollama
            # télécharge exactement celui que l'agent va appeler.
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ollama-config
                  key: model
            - name: WATCHED_NAMESPACE
              value: "aiops"
            # Timeout de l'appel au LLM : long, car un modèle 14B sans GPU
            # peut mettre plusieurs minutes à répondre (surtout la première
            # fois, où le modèle doit être chargé en mémoire).
            - name: LLM_TIMEOUT
              value: "300"
            # Fenêtre anti-doublon, en secondes : une alerte déjà analysée
            # (même empreinte, même début) n'est pas renvoyée au LLM quand
            # Alertmanager renvoie son groupe.
            - name: DEDUP_WINDOW_S
              value: "600"
            # Auto-guérison (étape 4). Sans ces variables, elle est
            # désactivée. Ici elle est activée en DRY-RUN : l'agent envoie
            # son patch avec dryRun=All, le serveur d'API le valide (droits,
            # schéma) sans rien enregistrer, et l'agent journalise ce qu'il
            # AURAIT fait. Passer en mode réel est une décision humaine :
            #   kubectl -n aiops set env deploy/aiops-agent AUTOHEAL_DRY_RUN=false
            - name: AUTOHEAL_ENABLED
              value: "true"
            - name: AUTOHEAL_DRY_RUN
              value: "true"
            # Nouvelle limite = ancienne x 1,5, jamais au-delà du plafond :
            # 128Mi -> 192Mi -> 288Mi -> 432Mi -> 512Mi, puis plus rien.
            - name: AUTOHEAL_MEMORY_FACTOR
              value: "1.5"
            - name: AUTOHEAL_MEMORY_MAX
              value: "512Mi"
            # Une action par Deployment par heure au plus : si l'application
            # est de nouveau tuée juste après, ce n'est plus une limite trop
            # basse mais probablement une fuite, et c'est à un humain d'agir.
            - name: AUTOHEAL_COOLDOWN_S
              value: "3600"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # La sonde de VIVACITÉ (/live) : vérifie que le PROCESS de
          # l'agent tourne. C'est la seule chose qu'un redémarrage de pod
          # pourrait réparer.
          #
          # Elle ne doit PAS dépendre d'Ollama ni de Prometheus. Si c'était
          # le cas, une panne d'Ollama redémarrerait l'agent en
          # boucle — sans rien réparer, puisque le redémarrage ne ferait
          # pas revenir Ollama. C'est exactement le défaut qu'on a observé
          # pendant le développement : l'agent redémarrait toutes les 30 s
          # parce qu'Ollama n'était pas encore prêt.
          #
          # La règle : « la vivacité dépend de ce que je contrôle, la
          # disponibilité dépend de ce que je consomme ».
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # La sonde de DISPONIBILITÉ (/health) : vérifie que l'agent peut
          # réellement faire son travail, donc que ses dépendances
          # (Ollama, Prometheus, API Kubernetes) répondent.
          #
          # Si Ollama tombe, le pod sort du Service : il ne reçoit plus de
          # webhook, mais il n'est pas redémarré pour rien. Kubernetes
          # attend que la sonde redevienne verte pour le réinscrire dans
          # le Service.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 2
      volumes:
        # Seul répertoire inscriptible du conteneur, pour les fichiers
        # temporaires éventuels des bibliothèques.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
# ---------------------------------------------------------------------------
# 5. Service — l'adresse stable du webhook
# ---------------------------------------------------------------------------
# ClusterIP : le Service n'est accessible que depuis l'intérieur du
# cluster. C'est ce qu'il faut — l'agent n'a pas vocation à être exposé
# sur l'hôte.
#
# Le port 8080 correspond au containerPort de l'agent. Alertmanager
# livrera le webhook sur http://aiops-agent.aiops.svc.cluster.local:8080/webhook
apiVersion: v1
kind: Service
metadata:
  name: aiops-agent
  namespace: aiops
  labels:
    app: aiops-agent
spec:
  type: ClusterIP
  selector:
    app: aiops-agent
  ports:
    - name: http
      port: 8080
      targetPort: http

# Application de démonstration — Deployment + Service.
#
# Cette application est la CIBLE des incidents que l'agent IA devra
# diagnostiquer. Elle est volontairement minimale : son rôle est d'être facile
# à casser et d'exposer des signaux observables.
#
# Les détails sur les endpoints (/health, /crash, /oom, /metrics) sont dans
# app/main.py.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: aiops
  labels:
    app: demo-app
    app.kubernetes.io/part-of: k8s-aiops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      # L'image tourne sous l'UID 1000 (USER du Dockerfile). runAsNonRoot
      # fait refuser le pod par Kubernetes si l'image changeait pour root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-app
          # Tag local chargé dans le nœud kind via `make build`.
          # imagePullPolicy: Never est indispensable : sans lui, le kubelet
          # tente de tirer l'image depuis un registre distant et échoue
          # (ErrImagePull) puisque l'image n'existe que localement.
          image: ghcr.io/abi0066/k8s-aiops-demo-app:sha-c6591b9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # Aucun privilège : pas de capacité Linux, pas d'élévation, et un
          # système de fichiers en lecture seule. Le seul répertoire
          # inscriptible est /tmp, où waitress peut mettre en tampon les
          # corps de requête volumineux.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Les limites de ressources sont au cœur du projet : c'est
          # l'illustration même de l'auto-guérison de l'étape 4.
          #
          # memory: 128Mi est volontairement BAS. L'endpoint /oom va
          # s'appuyer dessus pour provoquer un OOMKill réel. Quand l'agent
          # augmentera cette valeur, ce sera parce qu'il aura diagnostiqué
          # un OOMKilled.
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # La sonde de vivacité utilise /health. Kubernetes redémarre le
          # conteneur si l'endpoint ne répond pas pendant 3 échecs.
          #
          # Note : pour le scénario /crash, c'est le process qui meurt
          # (exit 1) — Kubernetes le redémarre de lui-même en CrashLoopBackOff.
          # La sonde sert pour les pannes "process vivant mais figé".
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      # Le pod doit terminer proprement : SIGTERM envoyé au conteneur, puis
      # SIGKILL au bout de 10 s. Ce réglage vit au niveau du POD
      # (spec.template.spec), pas du conteneur.
      #
      # Pas strictement nécessaire ici (l'app meurt brutalement sur /crash),
      # mais c'est la bonne pratique sur un vrai workload.
      terminationGracePeriodSeconds: 10
      volumes:
        # emptyDir sur disque, pas en mémoire (medium: Memory) : un tmpfs
        # serait compté dans la limite de 128Mi et fausserait le scénario
        # /oom.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: aiops
  labels:
    app: demo-app
spec:
  type: NodePort
  selector:
    app: demo-app
  ports:
    - name: http
      # Port du service à l'intérieur du cluster.
      port: 80
      targetPort: http
      # NodePort : le kubelet expose ce port sur le nœud.
      # 30090 est mappé sur l'hôte par kind-config.yaml (extraPortMappings).
      nodePort: 30090

# Ollama — le serveur de modèles de langage local, dans le cluster.
#
# Pourquoi Ollama est-il dans le cluster et pas sur la machine hôte ?
#
# L'agent est un pod. Il ne peut joindre que ce qui est joignable depuis
# le réseau du cluster. Ollama installé sur la machine hôte n'écoute que
# sur 127.0.0.1 (c'est son comportement par défaut) : le pod ne pourrait
# pas l'atteindre.
#
# Le coût de ce choix : ~3.4 Go d'image + ~9 Go de modèle, et jusqu'à
# 20 Go de RAM pour l'inférence (limite du conteneur).

# ---------------------------------------------------------------------------
# 0. ConfigMap — le modèle utilisé
# ---------------------------------------------------------------------------
# Déclaré une seule fois : l'initContainer ci-dessous le télécharge, et
# l'agent (manifests/aiops-agent.yaml) lit la même clé pour l'appeler.
# Changer de modèle = changer cette valeur, puis redémarrer les deux
# Deployments.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-config
  namespace: aiops
  labels:
    app: ollama
data:
  model: "qwen2.5-coder:14b"
---
# ---------------------------------------------------------------------------
# 1. PersistentVolumeClaim — le disque qui abrite le modèle
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: aiops
  labels:
    app: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
---
# ---------------------------------------------------------------------------
# 2. Deployment Ollama
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: aiops
  labels:
    app: ollama
    app.kubernetes.io/part-of: k8s-aiops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # Ollama reste root : les modèles déjà présents dans le PVC lui
      # appartiennent. Le reste du durcissement s'applique (seccomp, aucune
      # capacité Linux, pas d'élévation de privilèges).
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # --- initContainer : télécharge le modèle -------------------------
      initContainers:
        - name: pull-model
          # Version épinglée : `latest` changerait d'image à chaque
          # recréation du cluster, sans trace dans Git.
          image: docker.io/ollama/ollama:0.40.8
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          env:
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ollama-config
                  key: model
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - |
              set -e
              echo "=== Modèle ${OLLAMA_MODEL} dans le PVC ==="
              export OLLAMA_MODELS=/models
              echo "OLLAMA_MODELS=${OLLAMA_MODELS}"
              /bin/ollama serve > /tmp/ollama.log 2>&1 &
              OLLAMA_PID=$!
              echo "Serveur Ollama lancé (PID ${OLLAMA_PID})"
              for i in $(seq 1 30); do
                if /bin/ollama list > /dev/null 2>&1; then
                  echo "Serveur prêt après ${i}s."
                  break
                fi
                if [ "$i" -eq 30 ]; then
                  echo "ERREUR : le serveur Ollama n'a pas démarré." >&2
                  cat /tmp/ollama.log >&2
                  exit 1
                fi
                sleep 1
              done
              # Déjà dans le PVC : on ne contacte pas le registre. Le pod
              # redémarre ainsi sans réseau, et sans attendre la
              # vérification du manifeste distant.
              if /bin/ollama show "${OLLAMA_MODEL}" > /dev/null 2>&1; then
                echo "Modèle déjà présent, pas de téléchargement."
              else
                /bin/ollama pull "${OLLAMA_MODEL}"
              fi
              echo "=== Modèles disponibles ==="
              /bin/ollama list
              kill "${OLLAMA_PID}" 2>/dev/null || true
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      # --- conteneur principal ------------------------------------------
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.40.8
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: OLLAMA_MODELS
              value: "/models"
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_VULKAN
              value: "1"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "4096"
          ports:
            - name: http
              containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dri
              mountPath: /dev/dri
          resources:
            requests:
              memory: "4Gi"
              cpu: "500m"
            limits:
              memory: "20Gi"
              cpu: "4000m"
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
        # Le GPU de l'hôte, pour l'inférence Vulkan (OLLAMA_VULKAN).
        # DirectoryOrCreate : sur une machine sans GPU, /dev/dri n'existe
        # pas ; un répertoire vide est créé et Ollama tourne sur CPU au lieu
        # de bloquer le pod au démarrage.
        - name: dri
          hostPath:
            path: /dev/dri
            type: DirectoryOrCreate
---
# ---------------------------------------------------------------------------
# 3. Service Ollama
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: aiops
  labels:
    app: ollama
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http

# Objet TEMPORAIRE, présent uniquement pour vérifier le `prune` de Flux.
#
# Protocole :
#   1. ce fichier est commité et poussé  -> Flux crée le ConfigMap ;
#   2. il est retiré du dépôt et poussé  -> Flux supprime le ConfigMap.
#
# Sa suppression prouve que `prune: true` nettoie le cluster des objets qui
# ne sont plus dans Git. Ce fichier ne doit pas rester : il est supprimé au
# commit suivant.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prune-test
  namespace: aiops
  labels:
    app.kubernetes.io/part-of: prune-test
data:
  but: "vérifier que Flux supprime un objet retiré de Git"
  cree: "temporaire"

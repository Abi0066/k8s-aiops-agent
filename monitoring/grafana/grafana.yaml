# Grafana — Deployment + Service + provisionnement.
#
# Grafana sert de couche de visualisation : Prometheus stocke et requête les
# métriques, Grafana les présente sous forme de tableaux de bord.
#
# Le provisionnement (datasource + dashboard) se fait par des ConfigMap
# montés dans /etc/grafana/provisioning. Cela évite de configurer l'interface
# à la main — un dashboard qui se provisionne au démarrage est reproductible
# et versionnable, ce qui est exactement ce qu'on veut dans un projet
# présenté à un recruteur.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: aiops
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    # Source de données Prometheus, provisionnée automatiquement.
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        # URL interne du Service Prometheus dans le cluster.
        url: http://prometheus.aiops.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: aiops
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        # L'image officielle tourne sous l'utilisateur `grafana` (UID 472).
        # fsGroup lui donne l'écriture sur /var/lib/grafana (base SQLite
        # locale). Mêmes valeurs que le chart Helm officiel.
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:12.3.0
          # Image chargée localement par `make build` (voir les autres manifests).
          imagePullPolicy: IfNotPresent
          env:
            # Suppression de l'écran de bienvenue et du formulaire de
            # création de compte : on veut un dashboard qui s'ouvre
            # directement, sans intervention.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            # Mot de passe admin initial, en clair : acceptable uniquement
            # parce que Grafana n'est joignable que depuis la machine locale
            # (kind-config.yaml lie le port à 127.0.0.1). Sur un vrai
            # cluster, il viendrait d'un Secret (valueFrom.secretKeyRef).
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          # Pas de readOnlyRootFilesystem : Grafana écrit aussi ses logs et
          # ses plugins dans l'image. Le reste du durcissement s'applique.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          # /api/health vérifie aussi la base SQLite : si elle devient
          # inaccessible, Kubernetes redémarre le conteneur au lieu de le
          # laisser servir des erreurs.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasource
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: aiops
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30094

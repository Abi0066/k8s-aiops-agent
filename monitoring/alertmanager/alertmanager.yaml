# Configuration Alertmanager.
#
# Alertmanager est le composant qui reçoit les alertes de Prometheus et décide
# de l'envoyer (ou non) à un destinataire. Il apporte le grouping, l'inhibition,
# les silences et le routage — des fonctions qu'un webhook direct ne savait pas
# faire.
#
# Trois sections à comprendre :
#
#   route      : l'arbre de décision. Quelle alerte va vers quel receiver ?
#   receivers  : les destinations (webhook, Slack, email...).
#   inhibit_rules : quelles alertes en masquent d'autres.
#
# Documentation : https://prometheus.io/docs/alerting/latest/configuration/

global:
  # Délai au bout duquel une alerte SANS date de fin est considérée comme
  # résolue si elle n'est plus renvoyée. Les alertes de Prometheus portent
  # toujours une date de fin : ce réglage ne vaut que pour d'autres sources.
  resolve_timeout: 5m

  # SMTP — non utilisé. Commenté pour servir de modèle si on veut brancher
  # l'envoi d'e-mails plus tard.
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@example.com'

route:
  # Receiver par défaut : tout ce qui ne matche aucune route plus spécifique
  # arrive ici.
  receiver: aiops-agent

  # group_by : les labels qui définissent « une même alerte ». En grouper par
  # (alertname, namespace) signifie que 3 pods qui plantent pour la même
  # raison produisent UNE notification au lieu de trois.
  group_by: ['alertname', 'namespace']

  # Attente avant la PREMIÈRE notification d'un nouveau groupe : laisse le
  # temps aux alertes sœurs d'arriver pour partir ensemble.
  group_wait: 10s

  # Attente avant de notifier à nouveau un groupe déjà notifié, quand une
  # alerte y entre ou en sort. Alertmanager renvoie alors tout le groupe :
  # l'agent écarte les alertes qu'il a déjà analysées.
  group_interval: 1m

  # Délai avant de RENVOYER un groupe dont rien n'a changé. 4 h est
  # raisonnable : on ne veut pas relancer une analyse toutes les 5 minutes.
  repeat_interval: 4h

  # Règles de routage plus spécifiques que la route par défaut. Alertmanager
  # évalue les routes de haut en bas et s'arrête à la première qui matche
  # (sauf `continue: true`).
  #
  # Une seule route suffit aujourd'hui : l'agent traite toutes les
  # sévérités. Un routage par sévérité ressemblerait à ceci :
  routes: []
    # - receiver: aiops-agent-critical
    #   matchers:
    #     - severity="critical"
    #   continue: true

receivers:
  # Le receiver principal : notre agent IA, joint par son Service
  # Kubernetes (manifests/aiops-agent.yaml). Si l'agent est indisponible,
  # Alertmanager journalise l'échec et réessaie.
  - name: aiops-agent
    webhook_configs:
      - url: http://aiops-agent.aiops.svc.cluster.local:8080/webhook
        # send_resolved : true envoie aussi un événement quand l'alerte est
        # résolue (firing -> resolved). L'agent les reçoit mais n'analyse
        # aujourd'hui que les alertes actives ; la résolution servira à
        # confirmer qu'une remédiation automatique a fonctionné.
        send_resolved: true

# Inhibition : une alerte grave masque les alertes moins graves sur la même
# ressource. C'est ce qui évite que l'agent analyse 5 alertes quand le pod
# est simplement mort.
#
# Exemple : si le pod est down, on n'a pas besoin d'être prévenu aussi d'une
# latence élevée sur ce même pod — la cause racine est déjà identifiée.
#
# `equal` exige que les deux alertes aient la même valeur pour ces labels.
# Un label absent des deux côtés compte comme égal : DemoAppDown et
# DemoAppHighLatency n'ont pas de label `pod`, mais doivent toutes deux
# porter `namespace` (voir monitoring/prometheus/tests/alerts_test.yaml).
inhibit_rules:
  - source_matchers:
      - alertname="DemoAppDown"
    target_matchers:
      - severity="warning"
    equal: ['namespace', 'pod']

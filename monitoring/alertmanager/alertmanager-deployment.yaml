# Alertmanager — Deployment + Service.
#
# Alertmanager reçoit les alertes de Prometheus, les regroupe, les inhibe
# entre elles, puis les envoie au receiver configuré (notre agent IA).
---
# La ConfigMap alertmanager-config n'est PAS définie ici : kustomize la génère
# depuis monitoring/alertmanager/alertmanager.yaml (configMapGenerator de
# monitoring/kustomization.yaml). Même approche que pour la configuration
# Prometheus — on garde la config dans un fichier séparé, lisible et commenté.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: aiops
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      # Même durcissement que Prometheus (voir monitoring/prometheus/
      # prometheus.yaml) : l'image tourne sous `nobody` et n'écrit que dans
      # son volume de données /alertmanager (silences, état des envois).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.29.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          # /-/ready ne répond OK que lorsque la configuration a été chargée
          # et validée. Une sonde sur /-/healthy ne détecterait pas une
          # configuration invalide — Alertmanager resterait "vivant" mais
          # incapable de router les alertes.
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: aiops
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http

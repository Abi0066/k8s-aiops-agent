# Prometheus — Deployment + Service.
#
# Prometheus « vanilla » (image officielle), pas le chart Helm ni le
# Prometheus Operator. Toute la configuration est dans des ConfigMap versionnés
# dans monitoring/prometheus/.
---
# ServiceAccount de Prometheus : il a besoin de lire l'API Kubernetes pour la
# découverte de services (kubernetes_sd_configs).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: aiops
  labels:
    app.kubernetes.io/name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: aiops
---
# Les ConfigMaps prometheus-config et prometheus-rules ne sont PAS définis ici.
# Ils sont générés par scripts/cluster-up.sh depuis les fichiers sources :
#   monitoring/prometheus/config.yaml         -> prometheus-config (clé prometheus.yml)
#   monitoring/prometheus/rules/alerts.yaml  -> prometheus-rules (clé alerts.yaml)
#
# Pourquoi ? Parce que la configuration Prometheus est longue et commentée.
# La garder dans un fichier .yaml à part permet de la lire, la versionner et
# la relire sans bruit, et le script n'a plus qu'à la monter telle quelle.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: aiops
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        # Les pods Prometheus tournent en root dans l'image officielle
        # (il a besoin d'écrire dans /prometheus). Sur un cluster durci on
        # utiliserait un fsGroup et un user non-root — documenté dans le
        # README comme piste d'amélioration.
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.7.3
          # Image chargée localement par `make build`. IfNotPresent évite un
          # pull inutile si elle est déjà dans le nœud, tout en restant
          # capable de la tirer si le cluster est reconstruit.
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          # La sonde utilise l'endpoint /-/ready de Prometheus, qui ne
          # répond OK que lorsque la configuration a été chargée avec succès.
          # Une sonde qui vérifie juste que le process répond ne détecterait
          # pas une config invalide.
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        # Volume pour les données TSDB (historique des métriques).
        # emptyDir = stockage éphémère : les données sont perdues si le pod
        # redémarre. Suffisant pour une démo ; en production on utiliserait un
        # PersistentVolumeClaim.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: aiops
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30093

# Prometheus — Deployment + Service.
#
# Prometheus « vanilla » (image officielle), pas le chart Helm ni le
# Prometheus Operator. Toute la configuration est dans des ConfigMap versionnés
# dans monitoring/prometheus/.
---
# ServiceAccount de Prometheus : il a besoin de lire l'API Kubernetes pour la
# découverte de services (kubernetes_sd_configs).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: aiops
  labels:
    app.kubernetes.io/name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: aiops
---
# Les ConfigMaps prometheus-config et prometheus-rules ne sont PAS définis ici.
# kustomize les génère depuis les fichiers sources (configMapGenerator de
# monitoring/kustomization.yaml) :
#   monitoring/prometheus/config.yaml         -> prometheus-config (clé prometheus.yml)
#   monitoring/prometheus/rules/alerts.yaml  -> prometheus-rules (clé alerts.yaml)
#
# Pourquoi ? Parce que la configuration Prometheus est longue et commentée.
# La garder dans un fichier .yaml à part permet de la lire, la versionner et
# la relire sans bruit ; kustomize n'a plus qu'à l'emballer telle quelle.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: aiops
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        # L'image officielle tourne déjà sous `nobody` (UID 65534). On
        # l'impose ici et Kubernetes refuse de lancer le pod s'il devait
        # tourner en root. fsGroup donne à ce groupe l'accès en écriture aux
        # volumes : Prometheus n'écrit que dans /prometheus (TSDB).
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        # Profil seccomp par défaut du runtime : bloque les appels système
        # rares dont un serveur HTTP n'a jamais besoin.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.7.3
          # Image chargée localement par `make build`. IfNotPresent évite un
          # pull inutile si elle est déjà dans le nœud, tout en restant
          # capable de la tirer si le cluster est reconstruit.
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          # Le conteneur n'a besoin d'aucun privilège : aucune capacité
          # Linux, pas d'élévation via un binaire setuid, et un système de
          # fichiers en lecture seule (seul le volume /prometheus est
          # inscriptible). Une faille dans Prometheus ne pourrait ni modifier
          # le binaire ni s'installer dans l'image.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          # La sonde utilise l'endpoint /-/ready de Prometheus, qui ne
          # répond OK que lorsque la configuration a été chargée avec succès.
          # Une sonde qui vérifie juste que le process répond ne détecterait
          # pas une config invalide.
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        # Volume pour les données TSDB (historique des métriques).
        # emptyDir = stockage éphémère : les données sont perdues si le pod
        # redémarre. Suffisant pour une démo ; en production on utiliserait un
        # PersistentVolumeClaim.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: aiops
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30093

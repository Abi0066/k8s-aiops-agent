# Configuration Prometheus — ConfigMap monté dans le pod Prometheus.
#
# Contenu de la configuration officielle Prometheus (format YAML) :
#   global       -> fréquence de scrape et règles d'évaluation
#   alerting       -> où envoyer les alertes qui se déclenchent (Alertmanager)
#   rule_files     -> fichiers de règles d'alerte (.yaml)
#   scrape_configs -> quelles cibles scraper, et comment
#
# Prometheus « vanilla » : aucun CRD, aucun Prometheus Operator. Les règles
# d'alerte sont des groupes (groups:) au format standard Prometheus, ce qui les
# rend lisibles par n'importe qui et exécutables par n'importe quel Prometheus.

global:
  # Fréquence de scrape : 15 s par défaut. Assez fin pour détecter un crash
  # rapidement, assez large pour ne pas surcharger l'API.
  scrape_interval: 15s
  # Fenêtre d'évaluation des règles : les expressions sont réévaluées à
  # cette fréquence.
  evaluation_interval: 15s

# ---------------------------------------------------------------------------
# Alertes — Étape 2
# ---------------------------------------------------------------------------
# Prometheus n'envoie jamais d'alerte directement à un webhook : il ne sait
# parler qu'à Alertmanager. Le chemin est donc
# Prometheus -> Alertmanager -> notre agent IA.
#
# Alertmanager apporte ce qu'un envoi direct n'aurait pas :
#   - grouping    : plusieurs alertes similaires -> une seule notification
#   - inhibition  : une alerte "pod down" masque les alertes du même pod
#   - repeat_interval : on ne renvoie pas la même alerte en boucle
#   - silences    : on peut couper une alerte pendant une maintenance
#
# Pour l'agent IA, le grouping est le bénéfice principal : sans lui, une
# panne réseau déclencherait une rafale d'appels HTTP à analyser.
#
# La configuration d'Alertmanager (route + receivers) est dans
# monitoring/alertmanager/alertmanager.yaml. C'est là qu'on filtre les
# alertes qui nous intéressent : le filtrage se fait sur les labels de
# l'alerte (namespace, severity), disponibles côté Alertmanager mais pas
# côté Prometheus au moment du relabeling.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager.aiops.svc.cluster.local:9093"
      # Timeout d'attente de la réponse d'Alertmanager. Court : si
      # Alertmanager ne répond pas, Prometheus ne doit pas rester bloqué.
      timeout: 10s

# ---------------------------------------------------------------------------
# Règles d'alerte — Étape 2
# ---------------------------------------------------------------------------
rule_files:
  - /etc/prometheus/rules/*.yaml

# ---------------------------------------------------------------------------
# Scrape — qui est surveillé
# ---------------------------------------------------------------------------
scrape_configs:
  # Le job par défaut : Prometheus se surveille lui-même. Indispensable pour
  # debuguer une configuration Prometheus (on vérifie que /metrics répond).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # L'application de démonstration. On cible le Service Kubernetes par son nom
  # DNS interne : chaque scrape passe par le Service, qui l'envoie à UN pod
  # (load-balancing iptables / IPVS de kube-proxy).
  #
  # Une cible statique est plus simple que kubernetes_sd_configs et suffit
  # avec un seul replica. Avec plusieurs replicas, chaque scrape tomberait
  # sur un pod différent : il faudrait alors kubernetes_sd_configs (role:
  # endpoints) pour scraper chaque pod séparément.
  - job_name: demo-app
    static_configs:
      - targets: ["demo-app.aiops.svc.cluster.local:80"]
        labels:
          service: demo-app
          # Une cible statique ne porte pas de namespace. On l'ajoute pour
          # que DemoAppDown en ait un, comme les autres alertes : le routage
          # d'Alertmanager (group_by) et la règle d'inhibition s'appuient
          # dessus, et l'agent sait dans quel namespace enquêter.
          namespace: aiops

  # kube-state-metrics expose l'ÉTAT courant des objets Kubernetes sous forme
  # de métriques (nombre de redémarrages, raison du dernier arrêt, phase du
  # pod...). C'est la source de kube_pod_container_status_restarts_total, utilisée
  # par la règle DemoAppCrashLooping. Sans ce composant, la détection de crash
  # est impossible : le kubelet seul n'expose pas l'historique des redémarrages.
  #
  # Pas de label `namespace` ajouté ici, contrairement à demo-app : chaque
  # série de kube-state-metrics porte déjà le namespace de l'objet qu'elle
  # décrit. Un label de cible du même nom le renommerait en
  # `exported_namespace` et casserait les règles d'alerte.
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics.aiops.svc.cluster.local:8080"]

  # Les métriques du kubelet de chaque nœud (pods lancés, opérations du
  # runtime, volumes...). Pas indispensable à la démonstration, mais c'est la
  # base d'une vraie supervision de cluster.
  #
  # Prometheus ne contacte pas le kubelet directement : il passe par le proxy
  # de l'API server (/api/v1/nodes/<nœud>/proxy/...), avec le token de son
  # ServiceAccount. Le certificat de l'API server couvre le nom
  # kubernetes.default.svc : la vérification TLS reste donc active, avec la
  # CA du cluster montée dans chaque pod.
  - job_name: kubernetes-nodes
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics

  # -------------------------------------------------------------------------
  # cAdvisor : la consommation réelle des conteneurs
  # -------------------------------------------------------------------------
  # Le job précédent (/metrics du kubelet) donne l'ACTIVITÉ du nœud, mais
  # pas la consommation mémoire/CPU de chaque conteneur. Cette donnée vit
  # dans un endpoint distinct du kubelet : /metrics/cadvisor, alimenté par
  # cAdvisor, intégré au kubelet.
  #
  # C'est INDISPENSABLE pour le diagnostic d'un OOMKill : sans
  # container_memory_working_set_bytes, l'agent sait que le conteneur a été
  # tué (exit code 137) mais pas s'il approchait de sa limite. Avec, il
  # peut dire « le conteneur utilisait 126 Mi sur une limite de 128 Mi ».
  #
  # Même accès que le job précédent (proxy de l'API server), seul le chemin
  # change.
  - job_name: kubernetes-cadvisor
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

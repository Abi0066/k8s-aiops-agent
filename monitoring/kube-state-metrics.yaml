# kube-state-metrics — exposition de l'état des objets Kubernetes en métriques.
#
# Pourquoi ce composant ?
# -------------------
# Le kubelet expose des métriques sur son activité (CPU, mémoire, trafic), mais
# PAS l'historique métier des objets : combien de fois un conteneur a
# redémarré, pour quelle raison le pod s'est arrêté, quel était le dernier code
# de sortie.
#
# kube-state-metrics (KSM) parcourt l'API Kubernetes et publie cet état sous
# forme de métriques. C'est la source de :
#   - kube_pod_container_status_restarts_total  (règle DemoAppCrashLooping)
#   - kube_pod_container_status_last_terminated_reason (détection OOMKilled)
#   - kube_pod_status_phase, kube_pod_status_ready, ...
#
# Sans KSM, l'agent IA de l'étape 3 ne pourrait pas distinguer "le pod a crashé"
# de "le pod a été OOM-killé" en lisant les métriques : il devrait interroger
# l'API Kubernetes à chaque incident (plus lent, plus fragile).
#
# Nous ne l'installons pas via Helm (choix du projet : tout est en YAML versionné)
# mais via les manifests upstream, dont on ne garde ici que l'essentiel :
# un Deployment, un Service et les RBAC minimaux.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: aiops
  labels:
    app.kubernetes.io/name: kube-state-metrics
---
# RBAC : kube-state-metrics a besoin de LIRE l'état des objets. Il n'écrit
# jamais.
#
# Le projet n'exploite que des métriques de pods (redémarrages, raison et
# code du dernier arrêt, phase, limites). KSM est donc lancé avec
# `--resources=pods` (voir le Deployment) et n'a le droit de lire QUE les
# pods. Le manifest upstream lui donne aussi la lecture des Secrets de tout
# le cluster : un droit dangereux dont on n'a pas l'usage. Pour exposer
# d'autres objets (deployments, nodes...), ajouter la ressource aux deux
# endroits.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: aiops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: aiops
  labels:
    app: kube-state-metrics
    app.kubernetes.io/name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          # Version épinglée. Le digest est omis ici pour la lisibilité, mais
          # un vrai déploiement devrait le figer (voir l'étape 5 / Trivy).
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0
          # L'image est chargée dans le nœud par `make build` (kind load).
          # IfNotPresent l'utilise sans contacter le registre, tout en restant
          # capable de la tirer si elle manque (cluster recréé sans build).
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          # --resources : seuls les pods sont collectés (voir le ClusterRole).
          # Moins d'objets surveillés, c'est moins de mémoire et moins
          # d'appels à l'API server.
          # --telemetry-port : on le désactive, on n'en a pas besoin et cela
          # ouvre un port inutile dans le pod.
          args:
            - --resources=pods
            - --telemetry-port=0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: aiops
  labels:
    app: kube-state-metrics
spec:
  type: ClusterIP
  selector:
    app: kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
